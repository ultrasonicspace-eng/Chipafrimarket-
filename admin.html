<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chipafrimarket Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><a href="index.html">← Storefront</a><h1>Chipafrimarket Admin</h1></header><main><section id="login"><h2>Admin sign in</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><p id="loginMsg"></p></section><section id="dashboard" hidden><button id="logoutBtn">Sign out</button><h2>Products (enter prices in USD)</h2><form id="productForm"><input id="productId" type="hidden"><input id="name" placeholder="Product name" required><textarea id="description" placeholder="Description"></textarea><input id="price" type="number" min="0" step="0.01" placeholder="Master price in USD" required><label><input id="discount" type="checkbox" checked> Apply 50% launch discount</label><input id="photo" type="file" accept="image/*"><button>Save product</button><button type="button" id="resetBtn">Clear</button></form><div id="productList"></div><h2>Order requests</h2><div id="orderList"></div></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
